# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare real client IP restoration.
#
# With the orange cloud enabled, every request reaches the origin from a
# Cloudflare address. Without this, $remote_addr is a Cloudflare IP, so:
#   · access logs record Cloudflare, not visitors
#   · the application rate-limits all traffic into one bucket
#   · any `allow`/`deny` rule matches the wrong address
#
# `set_real_ip_from` lists the networks whose CF-Connecting-IP header is
# trusted. It must contain ONLY Cloudflare's ranges — trusting a wider range
# would let an attacker spoof their address.
#
# Regenerate when Cloudflare publishes new ranges:
#   sudo /var/www/vamoscalafate/deploy/scripts/update-cloudflare-ips.sh
#
# Generated from https://www.cloudflare.com/ips-v4 and /ips-v6
# ─────────────────────────────────────────────────────────────────────────────

# --- BEGIN CLOUDFLARE IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# --- END CLOUDFLARE IPv4 ---

# --- BEGIN CLOUDFLARE IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# --- END CLOUDFLARE IPv6 ---

# Cloudflare's own header. More reliable than X-Forwarded-For, which can carry
# a chain when another proxy sits in front of Cloudflare.
real_ip_header CF-Connecting-IP;

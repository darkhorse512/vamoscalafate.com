# ─────────────────────────────────────────────────────────────────────────────
# Response compression.
#
# Scoped to the server block rather than declared at http level: Ubuntu's stock
# /etc/nginx/nginx.conf already sets `gzip on;` there, and a duplicate
# directive in the same context is a fatal config error. Setting these per
# server overrides the global values cleanly, whatever the base config holds.
# ─────────────────────────────────────────────────────────────────────────────

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css text/xml application/json
                  application/javascript application/xml+rss
                  application/atom+xml image/svg+xml;

# Brotli compresses text roughly 20% smaller than gzip. Needs the
# libnginx-mod-http-brotli package; uncomment once it is installed.
# brotli            on;
# brotli_comp_level 6;
# brotli_types      text/plain text/css application/json application/javascript
#                   text/xml application/xml image/svg+xml;

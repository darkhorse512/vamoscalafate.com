# ─────────────────────────────────────────────────────────────────────────────
# Common proxy headers.
#
# MUST be `include`d in EVERY location that proxies, including ones that set
# their own headers.
#
# Nginx inherits `proxy_set_header` from an outer block ONLY IF the current
# block defines none of its own. A location that sets, say, `Upgrade` silently
# discards every inherited header — Host and X-Forwarded-For included — which
# would leave the application unable to see the client's address and break
# rate limiting.
# ─────────────────────────────────────────────────────────────────────────────

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# $remote_addr, not $proxy_add_x_forwarded_for.
#
# The application reads the FIRST entry of X-Forwarded-For as the client
# address. Appending to a client-supplied header would let anyone reaching the
# origin directly prepend a forged address and evade rate limiting.
#
# Sending only $remote_addr makes the value unforgeable: with the Cloudflare
# snippet loaded, nginx has already resolved it from CF-Connecting-IP for
# genuine Cloudflare traffic, and for anything else it is the real socket peer.
proxy_set_header X-Forwarded-For   $remote_addr;

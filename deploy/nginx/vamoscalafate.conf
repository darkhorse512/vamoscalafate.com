# ═══════════════════════════════════════════════════════════════════════════
# VAMOS CALAFATE - Nginx site configuration
#
#   Internet → HTTPS → Nginx ─┬─ vamoscalafate.com        → 127.0.0.1:3000
#                             ├─ www.vamoscalafate.com    → 301 to apex
#                             └─ admin.vamoscalafate.com  → 127.0.0.1:3001
#
# Install:
#   sudo cp vamoscalafate.conf /etc/nginx/sites-available/vamoscalafate
#   sudo ln -s /etc/nginx/sites-available/vamoscalafate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are issued by Certbot; see DEPLOYMENT.md. Run Certbot BEFORE
# enabling the TLS server blocks, or Nginx will fail to start on missing files.
#
# The Node processes bind to 127.0.0.1 only, so ports 3000/3001 are never
# reachable from the Internet - all traffic goes through this proxy.
# ═══════════════════════════════════════════════════════════════════════════

# ── Client IP restoration ──────────────────────────────────────────────────
# REQUIRED when the Cloudflare proxy (orange cloud) is enabled, which it is
# for vamoscalafate.com. Without it every request appears to come from a
# Cloudflare address and the application rate-limits all traffic as one client.
#
# Remove this include only if the orange cloud is turned off for every record.
include /etc/nginx/snippets/cloudflare-real-ip.conf;

# NOTE ON PROXY HEADERS
# Nginx inherits `proxy_set_header` from an outer block ONLY IF the current
# block sets none of its own. Declaring the shared headers here would
# therefore be silently discarded by any location that adds one of its own.
# They live in snippets/proxy-common.conf and are included per location.

# ── Rate-limit zones ───────────────────────────────────────────────────────
# A first line of defence in front of the application's own DB-backed limiter.
limit_req_zone $binary_remote_addr zone=vc_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vc_login:10m   rate=1r/s;
limit_req_zone $binary_remote_addr zone=vc_webhook:10m rate=10r/s;

# ═══════════════════ HTTP → HTTPS ═══════════════════════════════════════════

server {
    listen      80;
    listen      [::]:80;
    server_name vamoscalafate.com www.vamoscalafate.com admin.vamoscalafate.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP for
    # renewals to succeed.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════ www → apex ═════════════════════════════════════════════
# A single canonical hostname: two hostnames serving identical content splits
# ranking signals and creates duplicate-content issues.

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         www.vamoscalafate.com;

    ssl_certificate     /etc/letsencrypt/live/vamoscalafate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vamoscalafate.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vamoscalafate.com$request_uri;
}

# ═══════════════════ PUBLIC SITE ════════════════════════════════════════════

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         vamoscalafate.com;

    ssl_certificate     /etc/letsencrypt/live/vamoscalafate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vamoscalafate.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/compression.conf;

    # HSTS is set here as well as by the app, so it covers responses Nginx
    # serves directly (static media, error pages).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Uploads: keep in step with MAX_IMAGE_BYTES / MAX_DOCUMENT_BYTES.
    client_max_body_size 12M;
    client_body_timeout  60s;

    # Long-running requests are payment redirects and webhook handling.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    access_log /var/log/nginx/vamoscalafate.access.log;
    error_log  /var/log/nginx/vamoscalafate.error.log warn;

    # ── Immutable build assets ─────────────────────────────────────────────
    # Content-hashed filenames, so they can be cached forever.
    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Uploaded media, served straight from disk ──────────────────────────
    # Bypasses Node entirely. Must match STORAGE_LOCAL_DIR / STORAGE_PUBLIC_URL.
    location /media/ {
        alias /var/www/vamoscalafate/storage/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        # Uploaded files must never be executed or interpreted.
        add_header Content-Disposition "inline";
        access_log off;
        try_files $uri =404;
    }

    # ── Payment webhooks ───────────────────────────────────────────────────
    # Never cached, never buffered: the handler needs the raw body byte-for-byte
    # to verify the provider's signature.
    location /api/webhooks/ {
        limit_req zone=vc_webhook burst=20 nodelay;

        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # ── Everything else ────────────────────────────────────────────────────
    location / {
        limit_req zone=vc_general burst=60 nodelay;

        # Must come BEFORE the Upgrade headers below: this include is what
        # keeps Host and X-Forwarded-For from being dropped by them.
        include /etc/nginx/snippets/proxy-common.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / streaming support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}

# ═══════════════════ ADMIN ══════════════════════════════════════════════════

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         admin.vamoscalafate.com;

    # Separate certificate for the admin hostname. Certbot can cover both in
    # one call; see DEPLOYMENT.md.
    ssl_certificate     /etc/letsencrypt/live/admin.vamoscalafate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vamoscalafate.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/compression.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Belt and braces with the app's own header: the admin must never be
    # indexed, even if a response somehow bypasses the Next.js middleware.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    client_max_body_size 12M;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    access_log /var/log/nginx/vamoscalafate-admin.access.log;
    error_log  /var/log/nginx/vamoscalafate-admin.error.log warn;

    # ── OPTIONAL: restrict the admin to known networks ─────────────────────
    # The strongest control available here. Uncomment and set real addresses
    # if the team works from fixed IPs.
    #
    # allow 203.0.113.10;   # office
    # allow 198.51.100.24;  # VPN gateway
    # deny  all;

    location /_next/static/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Login gets its own tight limit - this is the credential-stuffing target.
    location = /login {
        limit_req zone=vc_login burst=5 nodelay;

        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=vc_general burst=40 nodelay;

        include /etc/nginx/snippets/proxy-common.conf;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# BOOTSTRAP configuration — HTTP only, no TLS.
#
# Used for the window between "the application is running" and "certificates
# have been issued". The full config references certificate files that do not
# exist yet, so nginx would refuse to start with it.
#
# What this does:
#   · serves /.well-known/acme-challenge/ from the webroot, so Certbot can
#     validate the domain
#   · proxies everything else to the applications, so the site can be checked
#     over plain HTTP before TLS is in place
#
# It does NOT redirect to HTTPS — that would break the ACME challenge.
#
# Replace it as soon as certificates exist:
#   sudo /var/www/vamoscalafate/deploy/scripts/enable-tls.sh
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name vamoscalafate.com www.vamoscalafate.com;

    client_max_body_size 12M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location /media/ {
        alias /home/vamoscalafate.com/storage/media/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}

server {
    listen      80;
    listen      [::]:80;
    server_name admin.vamoscalafate.com;

    # The admin is never indexable, even before TLS.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
    }
}
